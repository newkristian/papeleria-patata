spring:
  profiles:
    active: dev # Si no se especifica nada, arranca en modo DEV
  threads:
    virtual:
      enabled: true
  application:
    name: pos-system
  data:
    web:
      pageable:
        serialization-mode: via-dto
        default-page-size: 20
        max-page-size: 100
        page-parameter: page
        size-parameter: size
        sort-parameter: sort
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1
    out-of-order: false
app:
  jwt:
    secret: ${JWT_SECRET:Ptt-k@uuaii-JWT-S3cr3t-K3y-256-b1ts-M1n1mum!}
    expiration: ${JWT_EXPIRATION:3600000}
    refresh-expiration: ${JWT_EXPIRATION:86400000}
  storage-service:
    upload-path: ./upload-dir
  fotos:
    thumbnail-size: 200
    max-size: 5MB
    allowed-types: image/jpeg,image/png,image/gif,image/webp
    thumbnail:
      listado-size: 100    # Tamaño para thumbnails en listados
      detalle-size: 200    # Tamaño para thumbnails en detalle
    cache:
      enabled: true
      max-age: 86400       # 24 horas en segundos