spring:
  profiles:
    active: dev # Si no se especifica nada, arranca en modo DEV
  threads:
    virtual:
      enabled: true
  application:
    name: pos-system
  data:
    web:
      pageable:
        serialization-mode: via-dto
        default-page-size: 20
        max-page-size: 100
        page-parameter: page
        size-parameter: size
        sort-parameter: sort