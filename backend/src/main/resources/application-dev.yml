spring:
  datasource:
    url: jdbc:h2:mem:posdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    driverClassName: org.h2.Driver
    username: sa
    password: password
  h2:
    console:
      enabled: true # Para que puedas ver la DB en /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: validate # Flyway maneja el esquema
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    # H2 no soporta todas las features de PostgreSQL; ignoramos errores no bloqueantes
    placeholders:
      skip: true
  security:
    user:
      name: user
      password: password
