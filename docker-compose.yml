# ==============================================================================
# MANIFIESTO DOCKER COMPOSE — ENTORNO DE DESARROLLO LOCAL (DEV)
# ==============================================================================
# Uso típico en desarrollo:
#   docker compose up -d
#
# Para despliegues en producción (exige secretos y desactiva fallbacks):
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# ==============================================================================

services:
  db:
    image: postgres:16.2-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-posdb_dev}
      POSTGRES_USER: ${POSTGRES_USER:-posuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pospass}
    volumes:
      - db-data:/var/lib/postgresql/data
    # No se publica el puerto 5432 al host por defecto para mantener seguridad.
    # Si requieres conectar una herramienta de base de datos local en desarrollo,
    # descomenta las siguientes líneas:
    # ports:
    #   - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-posuser} -d ${POSTGRES_DB:-posdb_dev}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      DATABASE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-posdb_dev}
      DATABASE_USER: ${POSTGRES_USER:-posuser}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-pospass}
      JWT_SECRET: ${JWT_SECRET:-Ptt-k@uuaii-JWT-S3cr3t-K3y-256-b1ts-M1n1mum!}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-3600000}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION:-86400000}
    volumes:
      - backend-uploads:/app/upload-dir
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "4200:80"
    depends_on:
      - backend

volumes:
  db-data:
  backend-uploads:
